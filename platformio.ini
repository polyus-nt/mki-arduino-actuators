[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_filter = test_control
build_flags = -std=gnu++11
build_src_filter = +<native_main.cpp>

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  NicoHood/PinChangeInterrupt@^1.2.9
build_flags = -std=gnu++11
build_src_filter = +<main.cpp>

; Draft hardware API target. Without a board header: NO physical fan outputs.
[env:api_uno_stub]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++11
build_src_filter = +<hardware_api_main.cpp>

; Set HARDWARE_API_BOARD_HEADER to an agreed pin map before using this on hardware.
[env:api_uno]
extends = env:api_uno_stub
lib_deps =
  NicoHood/PinChangeInterrupt@^1.2.9

; Compile the real six-channel branch; never flash this test-only pin map.
[env:api_uno_compile_check]
extends = env:api_uno
build_flags =
  -std=gnu++11
  -DHARDWARE_API_BOARD_HEADER=\"../test/compile_only_board.h\"
