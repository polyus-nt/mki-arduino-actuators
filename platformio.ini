[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  NicoHood/PinChangeInterrupt@1.2.9
build_flags = -std=gnu++11

; Compile the actual six-channel adapter with a rejected test-only pin map.
[env:uno_compile_check]
extends = env:uno
build_flags =
  -std=gnu++11
  -DHARDWARE_API_BOARD_HEADER=\"test/compile_only_board.h\"
