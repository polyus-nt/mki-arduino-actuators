[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_filter = test_control
build_flags = -std=gnu++11
build_src_filter = +<native_main.cpp>

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  NicoHood/PinChangeInterrupt@^1.2.9
build_flags = -std=gnu++11
build_src_filter = +<main.cpp>
