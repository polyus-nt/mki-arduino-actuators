[platformio]
default_envs = uno, uno_second

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  NicoHood/PinChangeInterrupt@1.2.9
build_flags = -std=gnu++11

; Вторая Arduino, глобальные вентиляторы 4/5, локальные индексы 0/1.
[env:uno_second]
extends = env:uno
build_flags = -std=gnu++11 -DAPI_ACTUATOR_BOARD=2

; Карта с конфликтом должна компилироваться, но отклоняться BoardIO::setup.
[env:uno_compile_check]
extends = env:uno
build_flags =
  -std=gnu++11
  -DHARDWARE_API_BOARD_HEADER=\"test/compile_only_board.h\"
